{% extends "learning_logs/base.html" %}
{% block content %}
  <div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">Track your learning.</h1>
      <p class="col-md-8 fs-4">
        Make your own Learning Log to keep track of topics you’re studying.
        Add new entries as you learn more about each topic.
      </p>
      {% if not user.is_authenticated %}
        <a class="btn btn-primary btn-lg" href="{% url 'users:register' %}">
          Register now &raquo;
        </a>
      {% endif %}
    </div>
  </div>
{% endblock content %}
